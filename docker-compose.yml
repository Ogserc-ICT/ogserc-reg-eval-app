services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogserc
      POSTGRES_PASSWORD: ogserc
      POSTGRES_DB: ogserc
      TZ: Africa/Lagos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
